openapi: 3.0.0
info:
  title: Deskly API
  version: 1.0.0
  description: Deskly API specification for desk management and bookings.
servers:
  - url: 'http://localhost:4000'
paths:
  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /desks:
    get:
      summary: List Desks
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses:
        '200':
          description: Successfully retrieved list of desks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Desk'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /desks/{deskId}:
    parameters:
      - name: deskId
        in: path
        required: true
        schema:
          type: string
        example: desk-1
    get:
      summary: Get Desk By Id
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses:
        '200':
          description: Successfully retrieved desk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desk'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Desk not found

  /bookings:
    get:
      summary: List Bookings
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses:
        '200':
          description: Successfully retrieved list of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create Booking
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deskId
                - date
                - bookedBy
              properties:
                deskId:
                  type: string
                  example: desk-2
                date:
                  type: string
                  format: date
                  example: '2026-08-20'
                bookedBy:
                  type: string
                  format: email
                  example: alex@example.com
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /bookings/{bookingId}:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
        example: bkg_seed01
    get:
      summary: Get Booking By Id
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses:
        '200':
          description: Successfully retrieved booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Booking not found
    delete:
      summary: Delete Booking
      parameters:
        - name: X-API-Key
          in: header
          schema:
            type: string
          example: demo-key
      responses:
        '204':
          description: Booking deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Booking not found

components:
  schemas:
    Desk:
      type: object
      properties:
        id:
          type: string
          example: desk_123
        name:
          type: string
          example: Standing Desk A1
        status:
          type: string
          enum: [available, occupied, reserved]
          example: available
    Booking:
      type: object
      properties:
        id:
          type: string
          example: bkg_seed01
        deskId:
          type: string
          example: desk-2
        date:
          type: string
          format: date
          example: '2026-08-20'
        bookedBy:
          type: string
          format: email
          example: alex@example.com
  responses:
    UnauthorizedError:
      description: Unauthorized - Invalid or missing X-API-Key
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Invalid API key